name: APK bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK erstellen
        run: gradle assembleRelease --no-daemon
      - name: Als Release zum Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Einsatzmonitor.apk
          gh release view aktuell >/dev/null 2>&1 || gh release create aktuell \
            --title "Einsatzmonitor – aktuelle Version" \
            --notes "Auf dem Handy öffnen und Einsatzmonitor.apk antippen. Wird bei jeder Änderung automatisch aktualisiert." \
            --latest
          gh release upload aktuell Einsatzmonitor.apk --clobber
          gh release edit aktuell --notes "Version 1.0.${{ github.run_number }} vom $(date -u +'%d.%m.%Y %H:%M') UTC. Auf dem Handy öffnen und Einsatzmonitor.apk antippen."
      - uses: actions/upload-artifact@v4
        with:
          name: Einsatzmonitor-APK
          path: android/Einsatzmonitor.apk
